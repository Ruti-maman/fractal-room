<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="dark light" />
    <!-- צבע סרגל הדפדפן באנדרואיד, כדי שלא יבצבץ פס לבן מעל מסך הסדנה -->
    <meta name="theme-color" content="#f5f4fc" />
    <title>חדר פרקטל</title>
    <script>
      /*
       * נפתר לפני הציור הראשון, בכוונה: אם המצב הכהה/בהיר היה נקבע רק
       * אחרי שה-React עולה, היה הבזק של המצב הלא נכון על מסך 65" בחדר.
       * `dark` הוא ברירת המחדל שכבר כתובה על <html>, וכאן רק מתקנים אותה
       * לפי מה שנשמר או לפי העדפת המערכת.
       */
      (function () {
        try {
          // מפתח v2: המצב הבהיר הפך לברירת המחדל, ומסך שבחר פעם "כהה"
          // תחת המפתח הישן לא אמור להיתקע בו.
          var saved = localStorage.getItem("fractal-theme-v2");
          var theme = saved === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          var effects = localStorage.getItem("fractal-effects");
          if (effects === "lite") document.documentElement.setAttribute("data-effects", "lite");
        } catch (e) {
          /* localStorage חסום (מצב פרטי/קיוסק נעול) - נשארים על המצב הכהה */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
