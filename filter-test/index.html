<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>בדיקת סינון - חדר פרקטל</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #14212b;
    color: #f2ede3;
    padding: 24px;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 4px;
  }
  p.sub {
    color: #9fb2bf;
    margin-top: 0;
    margin-bottom: 24px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #1c2e3a;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 10px;
  }
  .status {
    font-size: 28px;
    width: 36px;
    text-align: center;
    flex-shrink: 0;
  }
  .status.ok { color: #4caf50; }
  .status.fail { color: #e05353; }
  .status.pending { color: #d9a441; }
  .info {
    flex: 1;
  }
  .info .title {
    font-size: 18px;
    font-weight: bold;
  }
  .info .detail {
    font-size: 14px;
    color: #9fb2bf;
    margin-top: 2px;
    word-break: break-all;
  }
  button {
    background: #3a6b8a;
    color: #f2ede3;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }
  button:active { background: #2c5266; }
  .ua-box {
    background: #1c2e3a;
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 13px;
    color: #9fb2bf;
    word-break: break-all;
    margin-top: 20px;
  }
</style>
</head>
<body>

<h1>דף בדיקת סינון - חדר פרקטל</h1>
<p class="sub">פותחים על הפלזמה בחדר ובודקים כל שורה. סטטוס: ✅ תקין / ❌ נכשל / ⏳ ממתין לפעולה.</p>

<div id="rows"></div>

<div class="ua-box" id="ua-box"></div>

<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
